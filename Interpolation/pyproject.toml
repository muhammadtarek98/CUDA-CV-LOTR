[build-system]
# pip will install these *into* its isolated build environment *before*
requires = ["setuptools","wheel","pybind11","ninja"]
build-backend = "setuptools.build_meta"
[project]
name="Interpolation"
version="0.1.0"
[tool.setuptools]
packages=["Interpolation"]
py-modules =["InterpolationLayer","InterpolationModule"]
package-dir = {"" = "."}