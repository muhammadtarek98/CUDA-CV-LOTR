[build-system]
# pip will install these *into* its isolated build environment *before*
# importing your setup.py.
requires = ["setuptools","wheel","pybind11","ninja"]
build-backend = "setuptools.build_meta"
[project]
name="correlation"
version="0.1.0"
[tool.setuptools]
packages=["correlation"]
py-modules = ["correlation"]
package-dir = {"" = "."}
